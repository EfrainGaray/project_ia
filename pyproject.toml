[project]
name = "asistente-postulaciones"
version = "0.1.0"
description = "Asistente de postulaciones: extrae requisitos de ofertas, los compara con evidencia del perfil y recomienda un CV."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools]
py-modules = ["app", "itau"]
packages = ["asistente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S310"]  # urlopen on fixed, validated https URLs

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
